name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src:src/generated python -m unittest discover -s tests
      - run: node tests/test_navigation.mjs
      - run: node --check src/ui/native.js && node --check src/ui/dialer/native.js
      - run: python -m compileall -q src install.py
